  mongodb:
    image: mongo:8.0
    container_name: etl-airbnb-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./bases_datos/mongodb:/docker-entrypoint-initdb.d:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

